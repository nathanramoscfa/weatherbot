# pyproject.toml
[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[project]
name = "weatherbot"
version = "2.0.0.dev0"
description = "A personal hurricane-threat monitor built on official NHC and NWS products; informational only, never a substitute for official guidance."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nathan Ramos", email = "nathanramoscfa@gmail.com" }]
maintainers = [{ name = "Nathan Ramos", email = "nathanramoscfa@gmail.com" }]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
keywords = ["hurricane", "NHC", "NWS", "NOAA", "weather", "tropical-cyclone"]
dependencies = [
    "alembic>=1.20.0",
    "defusedxml>=0.7.1",
    "httpx>=0.28.1",
    "platformdirs>=4.13.0",
    "pydantic>=2.14.1,<3",
    "pyproj>=3.8.0",
    "rich>=15.0.0",
    "shapely>=2.2.0",
    "sqlalchemy>=2.1.5,<3",
    "typer>=0.27.3",
    "tzdata>=2026.5 ; sys_platform == 'win32'",
]

[project.scripts]
weatherbot = "weatherbot.cli:app"

[project.urls]
Homepage = "https://github.com/nathanramoscfa/weatherbot"
Repository = "https://github.com/nathanramoscfa/weatherbot.git"
Documentation = "https://github.com/nathanramoscfa/weatherbot/blob/main/README.md"
"Bug Tracker" = "https://github.com/nathanramoscfa/weatherbot/issues"
Changelog = "https://github.com/nathanramoscfa/weatherbot/blob/main/CHANGELOG.md"

[tool.uv.build-backend]
# The disclaimer ships in the sdist beside the README that links to it.
source-include = ["DISCLAIMER.md"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hypothesis>=6.170.2",
    "import-linter>=2.15",
    "jsonschema>=4.26.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pyshp>=3.1.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "respx>=0.23.1",
    "ruff>=0.17.0",
    "types-defusedxml>=0.7.0.20260504",
    "types-jsonschema>=4.26.0.20261006",
]
# roadmodel is the planning tool behind docs/roadmap/ (ROADMAP.md and
# phaseNN-roadmap.md); it is not an application dependency. pip is here
# because the roadmodel updater upgrades roadmodel with `.venv`'s
# `python -m pip`, and a uv-created environment has no pip of its own; as
# a group member it survives `uv sync`.
planning = [
    "pip>=26.2.1",
    "roadmodel>=0.2.80",
]

[tool.uv]
default-groups = ["dev", "planning"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]
# planning/ is the roadmodel kit export, rewritten by the updater; it is not project code.
extend-exclude = ["planning"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with `ruff format` (missing trailing comma)
    "ISC001", # conflicts with `ruff format` (implicit string concatenation)
    "CPY001", # no per-file copyright notice: line 1 is the repo-relative path comment and LICENSE is the notice
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # pytest tests are written with bare assert
    "D103", # a test function's name states what it checks; a docstring would repeat it
    "INP001", # pytest collects tests by path from the rootdir; test directories are not packages
]
"scripts/**" = [
    "T201", # the development scripts are command-line programs; printing is their interface
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests", "scripts"]
# tests/scripts/ import the development scripts as top-level modules, tests/live/
# reads the register through tests/contract/fixture_support.py, tests/services/
# serves recorded answers through tests/sources/source_support.py, and the service and
# live tests run commands through tests/cli/cli_support.py.
extraPaths = ["scripts", "tests/contract", "tests/sources", "tests/cli"]
venvPath = "."
venv = ".venv"

[tool.bandit]
# SAST covers the package and the development scripts: the pre-commit hook and
# CI both run `bandit -c pyproject.toml -r src scripts` (bandit takes its
# targets from the command line only). Tests are out of scope by path, never
# by skipping a rule globally; ruff's flake8-bandit rules (S) still cover them.
exclude_dirs = ["tests", ".venv", ".worktrees"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/scripts/ import the development scripts as top-level modules, tests/live/
# reads the register through tests/contract/fixture_support.py, tests/services/
# serves recorded answers through tests/sources/source_support.py, and the service and
# live tests run commands through tests/cli/cli_support.py.
pythonpath = ["scripts", "tests/contract", "tests/sources", "tests/cli"]
# `--allow-hosts`, not `--disable-socket`: asyncio on Windows opens a loopback
# socket pair that `--disable-socket` would block. Selecting `-m live` does
# not lift the guard, so every `live` test also carries pytest-socket's
# `enable_socket` marker.
addopts = "-ra --strict-markers --strict-config --allow-hosts=127.0.0.1,::1 -m 'not live and not corpus'"
filterwarnings = ["error"]
markers = [
    "live: calls real services; run deliberately with `-m live`",
    "corpus: needs the replay-corpus cache (scripts/fetch_replay_corpus.py)",
]

[tool.importlinter]
root_package = "weatherbot"
# External packages join the graph, so a contract can forbid a library.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The engine imports no other layer"
type = "forbidden"
source_modules = ["weatherbot.engine"]
forbidden_modules = [
    "weatherbot.sources",
    "weatherbot.services",
    "weatherbot.cli",
    "weatherbot.web",
]

[[tool.importlinter.contracts]]
name = "Layers import downward only"
type = "layers"
layers = [
    "weatherbot.cli | weatherbot.web",
    "weatherbot.services",
    "weatherbot.sources | weatherbot.engine",
    "weatherbot.models",
]

[[tool.importlinter.contracts]]
name = "Only the services touch the database"
type = "forbidden"
source_modules = [
    "weatherbot.models",
    "weatherbot.sources",
    "weatherbot.engine",
    "weatherbot.cli",
    "weatherbot.web",
]
forbidden_modules = ["sqlalchemy", "alembic"]
# The CLI and the web app reach the database through weatherbot.services, an indirect
# import this contract allows; a direct import from any of these layers breaks it.
allow_indirect_imports = true
