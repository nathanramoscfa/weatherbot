# .github/workflows/ci.yml
# Continuous integration for weatherbot 2. The repository is public, so every
# job runs on GitHub-hosted runners; never point this workflow at a
# self-hosted runner. The aggregate `gate` job is required on `main`,
# beside the aggregate `phase-verify` check.
#
# Trust boundary rules (docs/roadmap/ROADMAP.md, "Per-step security gate"):
#   - every third-party action is pinned to a full commit SHA;
#   - the workflow declares least-privilege `permissions:`;
#   - no repository secret is exposed to pull-request-triggered runs, and the
#     workflow never uses `pull_request_target`.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail any uv command that would change uv.lock instead of silently
  # re-resolving it.
  UV_LOCKED: "1"
  UV_LINK_MODE: copy

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Import contracts
        run: uv run lint-imports

  # Pyright analyses a `sys.platform == "win32"` branch only on Windows, where the
  # Windows-only winrt packages install, so the toast channel is type-checked there too.
  typecheck:
    name: typecheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: Pyright (strict)
        run: uv run pyright

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      - name: Install frontend dependencies (locked)
        run: npm --prefix frontend ci

      - name: Verify registry signatures
        run: npm --prefix frontend audit signatures

      - name: OpenAPI TypeScript schema drift check
        run: npm --prefix frontend run api:check

      - name: ESLint (--max-warnings 0)
        run: npm --prefix frontend run lint

      - name: TypeScript typecheck
        run: npm --prefix frontend run typecheck

      - name: Vitest unit tests
        run: npm --prefix frontend run test

      - name: Build frontend bundle
        run: npm --prefix frontend run build

      - name: Verify bundled package licences
        run: npm --prefix frontend run licenses:check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows ran the suite in 11.5 minutes before Phase 3 Step 6's command tests, which
    # replay the corpus under coverage; the bound leaves room for the suite to grow.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      # The engine's branch coverage floor holds for every engine module from Phase 3
      # Step 1 on. The coverage data file goes to the runner's temporary directory,
      # never the checkout.
      - name: Pytest (engine and policy branch coverage at least 90 percent)
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: >-
          uv run pytest
          --cov=weatherbot.engine
          --cov=weatherbot.services.policy
          --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-fail-under=90

      - name: Policy branch coverage at least 90 percent
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: >-
          uv run coverage report
          --include="*/services/policy.py"
          --fail-under=90

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      - name: Install frontend dependencies (locked)
        run: npm --prefix frontend ci

      - name: Build frontend into src/weatherbot/web/static
        run: npm --prefix frontend run build

      - name: Build the sdist and the wheel
        run: uv build

      - name: The sdist carries the disclaimer
        run: |
          shopt -s nullglob
          sdists=(dist/*.tar.gz)
          test "${#sdists[@]}" -eq 1
          tar -tzf "${sdists[0]}" | grep -E '/DISCLAIMER\.md$'

      - name: Install the wheel into a fresh environment and run it
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          smoke="$RUNNER_TEMP/smoke"
          uv venv "$smoke"
          if [ "$RUNNER_OS" = "Windows" ]; then bindir="$smoke/Scripts"; else bindir="$smoke/bin"; fi
          uv pip install --python "$smoke" "${wheels[0]}"
          expected="$(uv version --short | tr -d '\r')"
          actual="$("$bindir/weatherbot" --version | tr -d '\r')"
          echo "project version: $expected"
          echo "installed weatherbot --version: $actual"
          test "$expected" = "$actual"

      - name: The wheel carries the built frontend and licences
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          smoke="$RUNNER_TEMP/smoke"
          if [ "$RUNNER_OS" = "Windows" ]; then python="$smoke/Scripts/python"; else python="$smoke/bin/python"; fi
          WHEEL_PATH="${wheels[0]}" "$python" - <<'EOF'
          import os
          import zipfile

          with zipfile.ZipFile(os.environ["WHEEL_PATH"]) as zf:
              names = set(zf.namelist())
          assert "weatherbot/web/static/index.html" in names, "index.html missing from wheel"
          assert "weatherbot/web/static/licenses.json" in names, "licenses.json missing from wheel"
          print("wheel contains weatherbot/web/static/index.html and licenses.json")
          EOF

      # The migrations ship inside the wheel: the installed package, run outside the
      # checkout with its data directory in a temporary directory, creates a new
      # database at the Alembic head.
      - name: The installed wheel opens a new database at head
        env:
          WEATHERBOT_CONFIG_DIR: ${{ runner.temp }}/smoke-config
          WEATHERBOT_DATA_DIR: ${{ runner.temp }}/smoke-data
        working-directory: ${{ runner.temp }}
        run: |
          smoke="$RUNNER_TEMP/smoke"
          if [ "$RUNNER_OS" = "Windows" ]; then python="$smoke/Scripts/python"; else python="$smoke/bin/python"; fi
          "$python" - <<'EOF'
          import sys
          from pathlib import Path

          import weatherbot
          from weatherbot.services.config import AppPaths
          from weatherbot.services.persistence.database import (
              current_revision,
              head_revision,
              open_database,
          )

          installed = Path(weatherbot.__file__).resolve()
          assert installed.is_relative_to(Path(sys.prefix).resolve()), installed
          paths = AppPaths.resolve()
          assert not paths.database_path.exists()
          with open_database(paths) as database:
              revision = current_revision(database.engine)
              print(f"new database at revision {revision}; head {head_revision()}")
              assert revision == head_revision() == database.revision
              assert database.backup_path is None
          EOF

      - name: The installed wheel serves the built interface and health endpoint
        working-directory: ${{ runner.temp }}
        run: |
          smoke="$RUNNER_TEMP/smoke"
          if [ "$RUNNER_OS" = "Windows" ]; then python="$smoke/Scripts/python"; else python="$smoke/bin/python"; fi
          "$python" "$GITHUB_WORKSPACE/scripts/smoke_installed_web.py"

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install Python dependencies (locked)
        run: uv sync --locked

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      - name: Install frontend dependencies (locked)
        run: npm --prefix frontend ci

      - name: Build frontend into src/weatherbot/web/static
        run: npm --prefix frontend run build

      - name: Install Playwright Chromium
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Run Playwright browser smoke (e2e)
        run: npm --prefix frontend run e2e

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screenshots
          path: frontend/test-results/screenshots/

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-traces
          path: frontend/test-results/**/trace.zip

  # The CI half of the security gate (docs/roadmap/ROADMAP.md, "Per-step
  # security gate"): the same checks the pre-commit hook runs, so a
  # skipped hook cannot land an issue on `main`. gitleaks runs first; every
  # later step carries `if: '!cancelled()'`, so one run reports every finding
  # instead of stopping at the first. No secret is used.
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's
      # gitleaks_8.30.1_checksums.txt.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out (full history for the secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # A pull request scans its own commits; a push scans the pushed range,
      # or, when the range is unknown, the full history (.gitleaksignore
      # lists the verified placeholders in version 1's history).
      - name: Secret scan (gitleaks, redacted)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$HEAD_SHA"
          else
            range="$HEAD_SHA"
          fi
          echo "gitleaks: scanning $range"
          gitleaks git --redact --verbose --no-banner --exit-code 1 --log-opts="$range" .

      - name: Set up uv
        if: '!cancelled()'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install (locked)
        if: '!cancelled()'
        run: uv sync --locked

      - name: SAST (bandit over src and scripts)
        if: '!cancelled()'
        run: uv run bandit -c pyproject.toml -r src scripts

      - name: Dependency audit (pip-audit --strict over uv.lock)
        if: '!cancelled()'
        run: uv run python scripts/audit_deps.py

      - name: Set up Node
        if: '!cancelled()'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      - name: Install frontend dependencies (locked)
        if: '!cancelled()'
        run: npm --prefix frontend ci

      - name: Frontend dependency audit (npm audit --audit-level=high)
        if: '!cancelled()'
        run: npm --prefix frontend audit --audit-level=high

      - name: Frontend SAST (ESLint --max-warnings 0 with eslint-plugin-security)
        if: '!cancelled()'
        run: npm --prefix frontend run lint

      - name: Personal-data check (every tracked file)
        if: '!cancelled()'
        run: uv run python scripts/check_personal_data.py --all --ci

      - name: Personal-data self-test
        if: '!cancelled()'
        run: uv run python scripts/check_personal_data.py --self-test --ci

  # GitHub gives every job in `needs` a result, so requiring each to be
  # `success` (not failure, cancelled, or skipped) covers every job; a new job
  # joins the gate by joining this list.
  gate:
    name: gate
    if: ${{ always() }}
    needs: [lint, typecheck, frontend, test, package, browser, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -eu
          count=0
          for result in $RESULTS; do
            count=$((count + 1))
            if [ "$result" != "success" ]; then
              echo "A required job finished as: $result"
              exit 1
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "No job results to check"
            exit 1
          fi
          echo "All $count jobs succeeded"
