# .github/workflows/release.yml
# Tag-triggered release pipeline for Weatherbot 2.0+ (Phase 9 Decisions 4-7).
# Runs on GitHub-hosted runners only. Publishes through OIDC trusted publishing
# from protected `testpypi` (candidates) or `pypi` (releases) environments after
# operator approval; no repository secret or long-lived PyPI token is used.
# `workflow_dispatch` runs a dry run on `main` (build + smoke-built only; publishes nothing).
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_LOCKED: "1"
  UV_LINK_MODE: copy

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_candidate: ${{ steps.meta.outputs.is_candidate }}
      wheel_sha256: ${{ steps.dist.outputs.wheel_sha256 }}
    steps:
      - name: Check out (full history for main ancestry check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Verify release ref, tag, and main ancestry
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(uv version --short | tr -d '\r')"
          echo "project version: $version"
          if [ "$EVENT_NAME" = "push" ]; then
            if [ "$REF_TYPE" != "tag" ]; then
              echo "release push must be a tag, got $REF_TYPE" >&2
              exit 1
            fi
            if [ "v$version" != "$REF_NAME" ]; then
              echo "tag $REF_NAME does not match pyproject.toml version v$version" >&2
              exit 1
            fi
            if ! git rev-parse --verify refs/remotes/origin/main >/dev/null 2>&1; then
              git fetch --no-tags origin main:refs/remotes/origin/main
            fi
            if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
              echo "tagged commit $COMMIT_SHA is not on origin/main" >&2
              exit 1
            fi
            if [[ "$version" =~ rc[0-9]+$ ]]; then
              is_candidate="true"
            else
              is_candidate="false"
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REF_TYPE" != "branch" ] || [ "$REF_NAME" != "main" ]; then
              echo "dry run must be dispatched from branch main, got $REF_TYPE/$REF_NAME" >&2
              exit 1
            fi
            is_candidate="false"
          else
            echo "unsupported event: $EVENT_NAME" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'is_candidate=%s\n' "$is_candidate" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      - name: Install frontend dependencies (locked)
        run: npm --prefix frontend ci

      - name: Build frontend into src/weatherbot/web/static
        run: npm --prefix frontend run build

      - name: Verify bundled package licences
        run: npm --prefix frontend run licenses:check

      - name: Build sdist and wheel once
        run: uv build

      - name: Check distribution allowlist and record wheel SHA-256
        id: dist
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          uv run --no-project python scripts/check_dist.py dist --version "$VERSION"
          wheel="dist/weatherbot-${VERSION}-py3-none-any.whl"
          wheel_sha256="$(sha256sum "$wheel" | awk '{print $1}')"
          printf 'wheel_sha256=%s\n' "$wheel_sha256" >> "$GITHUB_OUTPUT"

      - name: Package replay corpus archive with SHA-256
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p corpus
          uv run --no-project python - <<'EOF'
          import hashlib
          import os
          import zipfile
          from pathlib import Path

          version = os.environ["VERSION"]
          src_root = Path("tests/fixtures/replay")
          archive_name = f"weatherbot-replay-corpus-{version}.zip"
          archive_path = Path("corpus") / archive_name

          with zipfile.ZipFile(archive_path, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(p for p in src_root.rglob("*") if p.is_file()):
                  rel = path.relative_to(src_root).as_posix()
                  info = zipfile.ZipInfo(rel, date_time=(2026, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  zf.writestr(info, path.read_bytes())

          digest = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          sha_path = Path("corpus") / f"{archive_name}.sha256"
          sha_path.write_text(f"{digest}  {archive_name}\n", encoding="utf-8", newline="\n")
          print(f"{archive_name} {archive_path.stat().st_size} bytes sha256={digest}")
          EOF

      - name: Upload built distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Upload replay corpus archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus
          path: corpus/*
          if-no-files-found: error

  smoke-built:
    name: smoke-built (${{ matrix.os }}, ${{ matrix.python }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13", "3.15"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Download built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Smoke-test the built wheel
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TARGET_PYTHON: ${{ matrix.python }}
        run: >-
          uv run --no-project --python "$TARGET_PYTHON"
          python scripts/release_smoke.py
          --wheel "dist/weatherbot-${VERSION}-py3-none-any.whl"
          --python "$TARGET_PYTHON"

  publish-testpypi:
    name: publish-testpypi
    needs: [build, smoke-built]
    if: ${{ github.event_name == 'push' && needs.build.outputs.is_candidate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/weatherbot/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish release candidate to TestPyPI via OIDC
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true

  publish-pypi:
    name: publish-pypi
    needs: [build, smoke-built]
    if: ${{ github.event_name == 'push' && needs.build.outputs.is_candidate == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/weatherbot/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish release to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true

  smoke-published:
    name: smoke-published (${{ matrix.os }}, ${{ matrix.python }})
    needs: [build, publish-testpypi, publish-pypi]
    if: ${{ !cancelled() && (needs.publish-testpypi.result == 'success' || needs.publish-pypi.result == 'success') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13", "3.15"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Smoke-test the published package from the index
        env:
          VERSION: ${{ needs.build.outputs.version }}
          IS_CANDIDATE: ${{ needs.build.outputs.is_candidate }}
          WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
          TARGET_PYTHON: ${{ matrix.python }}
        run: |
          set -euo pipefail
          if [ "$IS_CANDIDATE" = "true" ]; then
            uv run --no-project --python "$TARGET_PYTHON" python scripts/release_smoke.py \
              --index testpypi --version "$VERSION" --sha256 "$WHEEL_SHA256" \
              --python "$TARGET_PYTHON"
          else
            uv run --no-project --python "$TARGET_PYTHON" python scripts/release_smoke.py \
              --index pypi --version "$VERSION" --sha256 "$WHEEL_SHA256" \
              --python "$TARGET_PYTHON"
          fi

  github-release:
    name: github-release
    needs: [build, smoke-published]
    if: ${{ !cancelled() && needs.smoke-published.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Download replay corpus archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corpus
          path: corpus

      - name: Prepare release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.build.outputs.version }}
          NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          notes_path = Path(os.environ["NOTES_PATH"])
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")

          heading_re = re.compile(rf"^## \[{re.escape(version)}\][^\n]*\n", re.MULTILINE)
          match = heading_re.search(changelog)
          summary = ""
          if match is not None:
              rest = changelog[match.end():]
              stop = re.search(r"^#{2,3} ", rest, re.MULTILINE)
              summary = (rest[: stop.start()] if stop else rest).strip()

          tag = f"v{version}"
          link = f"https://github.com/nathanramoscfa/weatherbot/blob/{tag}/CHANGELOG.md"
          parts = []
          if summary:
              parts.append(summary)
          else:
              parts.append(f"Weatherbot {version}.")
          parts.append(f"Full changelog at tag `{tag}`: {link}")
          notes_path.write_text("\n\n".join(parts) + "\n", encoding="utf-8", newline="\n")
          EOF

      - name: Create GitHub Release with distributions and replay corpus
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          IS_CANDIDATE: ${{ needs.build.outputs.is_candidate }}
          NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          flags=()
          if [ "$IS_CANDIDATE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "v$VERSION" \
            --verify-tag \
            --title "Weatherbot $VERSION" \
            --notes-file "$NOTES_PATH" \
            "${flags[@]}" \
            dist/* corpus/*
