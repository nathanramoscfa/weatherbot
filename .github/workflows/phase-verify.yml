# .github/workflows/phase-verify.yml
# Keep every completed phase in the matrix; the aggregate remains the required check.
name: phase-verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase-verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"
  UV_LINK_MODE: copy

jobs:
  verify:
    name: phase-verify (${{ matrix.phase }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        phase: ["01", "02", "03", "04", "05"]
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: Static deliverable checks (--fast)
        run: uv run python scripts/verify_phase${{ matrix.phase }}.py --fast

      - name: Install gitleaks (pinned release, checksum verified)
        if: '!cancelled()'
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Set up Node
        if: "!cancelled() && matrix.phase == '05'"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: "!cancelled() && matrix.phase == '05'"
        run: npm --prefix frontend ci

      - name: Security gate (--security)
        if: '!cancelled()'
        run: uv run python scripts/verify_phase${{ matrix.phase }}.py --security

  phase-verify:
    name: phase-verify
    if: ${{ always() }}
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every phase to succeed
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
